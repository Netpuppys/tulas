      body {

      .no-scrollbar::-webkit-scrollbar {

      }
      .no-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }
      .animate-fadeIn {
        animation: fadeIn 0.35s ease;
      }
      @keyframes fadeIn {
        0% {
          opacity: 0;
          transform: translateY(8px);
        }
        100% {
          opacity: 1;
          transform: translateY(0);
        }
      }
      .swiper-button-next,
      .swiper-button-prev {
        color: #fff;
        background: rgba(255, 255, 255, 0.15);
        backdrop-filter: blur(6px);
        width: 2.75rem;
        height: 2.75rem;
        border-radius: 9999px;
        transition: all 0.2s ease;
      }
      .swiper-button-next:hover,
      .swiper-button-prev:hover {
        background: rgba(255, 255, 255, 0.35);
      }
      .swiper-button-next::after,
      .swiper-button-prev::after {
        font-size: 1rem;
        font-weight: 700;
      }
      .swiper-pagination-bullet {
        background: #fff;
        opacity: 0.5;
      }
      .swiper-pagination-bullet-active {
        background: #fff;
        opacity: 1;
        width: 1.5rem;
        border-radius: 0.375rem;
        transition: all 0.3s ease;
      }
      .life-scroll {
        scroll-snap-type: x mandatory;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
      }
      .life-scroll > .slide-item {
        scroll-snap-align: start;
        flex-shrink: 0;
        width: 85%;
        max-width: 900px;
      }
      @media (min-width: 640px) {
        .life-scroll > .slide-item {
          width: 80%;
        }
      }
      @media (min-width: 1024px) {
        .life-scroll > .slide-item {
          width: 75%;
        }
      }
      /* Partner Swiper styles */
      .partnerSwiper {
        overflow: visible !important;
        padding: 8px 0;
      }
      .partnerSwiper .swiper-slide {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100px;
        padding: 8px;
      }
      .partnerSwiper .swiper-slide img {
        max-height: 70px;
        max-width: 160px;
        width: auto;
        object-fit: contain;
        filter: grayscale(0%);
        transition:
          transform 0.3s ease,
          filter 0.3s ease;
        opacity: 0.9;
      }
      .partnerSwiper .swiper-slide img:hover {
        transform: scale(1.08);
        filter: grayscale(0%);
        opacity: 1;
      }
      .partner-pagination {
        position: relative !important;
        margin-top: 20px !important;
      }
      .partner-pagination .swiper-pagination-bullet {
        background: #ccc;
        opacity: 1;
      }
      .partner-pagination .swiper-pagination-bullet-active {
        background: #f26522;
        width: 1.5rem;
        border-radius: 0.375rem;
      }
      @media (min-width: 640px) {
        .partnerSwiper .swiper-slide img {
          max-height: 80px;
          max-width: 180px;
        }
      }
      @media (min-width: 1024px) {
        .partnerSwiper .swiper-slide img {
          max-height: 90px;
          max-width: 200px;
        }
      }
      /* Students Swiper */
      .studentsSwiper .swiper-slide {
        height: auto;
      }
      .studentsSwiper .swiper-slide img {
        width: 100%;
        height: 280px;
        object-fit: cover;
        border-radius: 1rem;
      }
      @media (min-width: 640px) {
        .studentsSwiper .swiper-slide img {
          height: 320px;
        }
      }
      @media (min-width: 1024px) {
        .studentsSwiper .swiper-slide img {
          height: 360px;
        }

      window.toggleFaq = function (index) {
        const answer = document.getElementById(`faq-answer-${index}`);
        const icon = document.getElementById(`faq-icon-${index}`);
        if (!answer || !icon) return;
        const isOpen = !answer.classList.contains("hidden");
        config.faqs.forEach((_, i) => {
          const a = document.getElementById(`faq-answer-${i + 1}`);
          const ic = document.getElementById(`faq-icon-${i + 1}`);
          if (a) a.classList.add("hidden");
          if (ic) {
            ic.classList.remove("fa-minus", "rotate-180");
            ic.classList.add("fa-plus");
          }
        });
        if (!isOpen) {
          answer.classList.remove("hidden");
          icon.classList.remove("fa-plus");
          icon.classList.add("fa-minus", "rotate-180");
        }
      };

  src="${img}" 
  alt="Program Highlight" 
  class="w-auto object-contain mx-auto"
  loading="lazy"
  onerror="this.src='./logo/fallback.webp'" 
/>
      `;
        document.getElementById("highlightsGrid").innerHTML = config.highlights
          .map(createCard)
          .join("");
      }

      function renderInternship() {
        const data = config.internship;
        const container = document
          .getElementById("internship-section")
          .querySelector(".max-w-5xl");
        container.innerHTML = `
        <div class="relative w-full rounded-3xl overflow-hidden bg-gray-50 shadow-sm border border-gray-100">
          <div class="">
            <img src="${data.heroImage}" alt="Corporate Interaction at Tulas" class="w-full h-full object-cover object-center" />
          </div>
        </div>
        <div class="max-w-4xl mx-auto text-center space-y-6 pt-2">
          <h2 class="text-2xl sm:text-3xl md:text-4xl font-bold tracking-tight text-brand-navy">
            <span class="text-brand-orange">Internship</span> Offered By Tulas
          </h2>
          <div class="space-y-4 text-gray-600 text-sm sm:text-base leading-relaxed max-w-3xl mx-auto">
            <p>${data.paragraphs[0]}</p>
            <p>${data.paragraphs[1]}</p>
          </div>
        </div>
        <div class="pt-4 max-w-3xl mx-auto">
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-y-8 gap-x-12">
            ${data.stats
              .map(
                (stat) => `
              <div class="flex items-center space-x-4">
                <span class="text-5xl sm:text-6xl font-extrabold text-brand-orange tracking-tight shrink-0 select-none">${stat.id}</span>
                <div class="text-zinc-800 text-sm sm:text-base leading-snug">
                  <span class="font-bold text-zinc-900">${stat.highlight}</span> ${stat.text}
                </div>
              </div>
            `,
              )
              .join("")}
          </div>
        </div>
      `;
      }

      // ---------- Life at Tulas - pure CSS scroll snap ----------
      let activeLifeCategory = "Fests";

      function renderLifeTabs() {
        const nav = document.getElementById("filterNav");
        const categories = Object.keys(config.lifeAtTulas.categories);
        nav.innerHTML = categories
          .map(
            (cat) => `
        <button onclick="switchLifeCategory('${cat}')" 
          class="px-6 py-2 rounded-full text-sm font-semibold transition-all duration-200 cursor-pointer ${
            cat === activeLifeCategory
              ? "bg-brand-orange text-white shadow-md"
              : "bg-white text-gray-700 hover:bg-gray-100 border border-gray-200"
          }">
          ${cat}
        </button>
      `,
          )
          .join("");
      }

      function renderLifeGallery(category) {
        const images = config.lifeAtTulas.categories[category] || [];
        const container = document.getElementById("lifeScrollContainer");
        const chunkSize = 6;
        const slideChunks = [];
        for (let i = 0; i < images.length; i += chunkSize) {
          slideChunks.push(images.slice(i, i + chunkSize));
        }
        container.innerHTML = slideChunks
          .map(
            (chunk) => `
        <div class="slide-item">
          <div class="grid grid-cols-3 grid-rows-2 gap-3 h-[420px] sm:h-[480px] lg:h-[520px]">
            ${chunk
              .map(
                (img) => `
              <div class="relative w-full h-full overflow-hidden rounded-xl bg-gray-200 shadow-sm group">
                <img src="${img}" alt="Gallery" class="w-full h-full object-cover object-center transition-transform duration-500 group-hover:scale-105" loading="lazy" />
              </div>
            `,
              )
              .join("")}
          </div>
        </div>
      `,
          )
          .join("");
      }

      function switchLifeCategory(cat) {
        if (cat === activeLifeCategory) return;
        activeLifeCategory = cat;
        renderLifeTabs();
        renderLifeGallery(cat);
      }
      window.switchLifeCategory = switchLifeCategory;

      // ---------- Hero Swiper ----------
      const slidesData = [
        {
          image: "./banner/d1.webp",
          title: "Welcome to Our Modern Campus",
          description:
            "Explore a state-of-the-art learning environment nestled in serene, natural surroundings.",
          ctaText: "Take a Virtual Tour",
          ctaLink: "#tour",
        },
        {
          image: "./banner/d2.webp",
          title: "World-Class Academic Facilities",
          description:
            "Empowering student success through advanced labs, spacious libraries, and modern sports grounds.",
          ctaText: "Explore Facilities",
          ctaLink: "#facilities",
        },
        {
          image: "./banner/d3.webp",
          title: "A Vibrant Student Community",
          description:
            "Join a diverse group of learners committed to innovation, excellence, and personal growth.",
          ctaText: "Apply Today",
          ctaLink: "#apply",
        },
      ];

      const createSlideHTML = ({
        image,
        title,
        description,
        ctaText,
        ctaLink,
      }) => `
      <div class="swiper-slide relative bg-cover bg-center flex items-center justify-center rounded-2xl" style="background-image: url('${image}')">
        <div class="absolute inset-0 bg-gradient-to-b from-black/40 via-black/50 to-black/75 z-10 rounded-2xl"></div>
        <div class="relative z-20 text-center text-white max-w-3xl px-6">
          <h1 class="text-3xl sm:text-4xl md:text-5xl font-bold tracking-tight mb-4 drop-shadow-md">${title}</h1>
          <p class="text-base sm:text-lg md:text-xl text-gray-200 mb-8 max-w-xl mx-auto leading-relaxed">${description}</p>
          <a href="${ctaLink}" class="inline-block px-8 py-3 bg-brand-orange hover:bg-brand-darkorange text-white font-semibold rounded-full shadow-lg transition-all duration-300 transform hover:-translate-y-0.5">
            <i class="fa-solid fa-compass"></i> ${ctaText}
          </a>
        </div>
      </div>
    `;

      document.addEventListener("DOMContentLoaded", function () {
        renderTopBar();
        renderHeader();
        renderHero();
        renderRanks();
        renderAbout();
        renderHighlightStats();
        renderSpecializations();
        renderCTASection();
        renderPartners();
        renderStudents(); // Now using Swiper
        renderFaqs();
        renderFooter();
        renderHighlights();
        renderInternship();

        renderLifeTabs();
        renderLifeGallery(activeLifeCategory);

        document.getElementById("swiperWrapper").innerHTML = slidesData
          .map(createSlideHTML)
          .join("");
        new Swiper(".heroSwiper", {
          effect: "fade",
          fadeEffect: { crossFade: true },
          loop: true,
          speed: 800,
          autoplay: { delay: 4500, disableOnInteraction: false },
          pagination: { el: ".swiper-pagination", clickable: true },
          navigation: {
            nextEl: ".swiper-button-next",
            prevEl: ".swiper-button-prev",
          },
        });

        // No need for old slider interval; Swiper handles autoplay
      });
    </script>
  </body>
</html>
